name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: yarinlab, POSTGRES_PASSWORD: yarinlab, POSTGRES_DB: yarinlab }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U yarinlab" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://yarinlab:yarinlab@localhost:5432/yarinlab
      DATABASE_URL_UNPOOLED: postgresql://yarinlab:yarinlab@localhost:5432/yarinlab
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm -w @yarinlab/server exec prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
        working-directory: apps/web
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-results, path: test-results }
